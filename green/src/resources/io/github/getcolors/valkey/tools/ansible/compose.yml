# Valkey on loopback, nowhere else. The configuration file carries the
# password so that neither the command line nor the container environment
# does; the healthcheck reads it from that file.
#
# Exposure is decided here, by what is published: inside the container Valkey
# binds every interface, and the one host binding — 127.0.0.1 — is the whole
# of what can reach it. No private network: a single-node package creates
# none (Compute Provider Standard §5), and the supported client path is an
# SSH tunnel to this loopback port.
name: valkey
services:
  valkey:
    image: <{ valkey-image }>
    restart: unless-stopped
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    ports:
      - "127.0.0.1:<{ valkey-port }>:6379"
    volumes:
      - /opt/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - valkey-data:/data
    healthcheck:
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$(sed -n 's/^requirepass //p' /etc/valkey/valkey.conf)\" valkey-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}
volumes:
  # The append-only file and the periodic RDB live here; a restart keeps them,
  # and the smoke gate proves it on every converge.
  valkey-data:
